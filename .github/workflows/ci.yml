name: Test

on:
  push:
    paths-ignore:
      - 'rapidyenc/**'
      - 'src/**'
  pull_request:
    paths-ignore:
      - 'rapidyenc/**'
      - 'src/**'

jobs:
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.config.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        config:
          - name: cgo
            cgo_enabled: 1
            goexperiment: ""
          - name: cgo-simd
            cgo_enabled: 1
            goexperiment: "simd"
          - name: no-cgo-simd
            cgo_enabled: 0
            goexperiment: simd
          - name: no-cgo
            cgo_enabled: 0
            goexperiment: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Run tests
        env:
          CGO_ENABLED: ${{ matrix.config.cgo_enabled }}
          GOEXPERIMENT: ${{ matrix.config.goexperiment }}
        run: |
          go run gotest.tools/gotestsum@latest \
            --junitfile unit-tests-${{ matrix.os }}-${{ matrix.config.name }}.xml \
            --format pkgname \
            -- ./...

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "unit-tests-*.xml"
