name: Test

on:
  push:
    paths-ignore:
      - 'rapidyenc/**'
      - 'src/**'
  pull_request:
    paths-ignore:
      - 'rapidyenc/**'
      - 'src/**'

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cgo
            cgo_enabled: 1
            goexperiment: ""
          - name: archsimd
            cgo_enabled: 0
            goexperiment: simd
          - name: scalar
            cgo_enabled: 0
            goexperiment: ""

    env:
      CGO_ENABLED: ${{ matrix.cgo_enabled }}
      GOEXPERIMENT: ${{ matrix.goexperiment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run tests
        run: |
          go run gotest.tools/gotestsum@latest \
            --junitfile unit-tests-${{ matrix.name }}.xml \
            --format pkgname \
            -- ./...

      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "unit-tests-*.xml"

  benchmark-compare:
    name: Compare benchmarks
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Benchmark CGO
        run: go test -bench=. -benchmem -count=5 ./... | tee benchmark-cgo.txt
        env:
          CGO_ENABLED: 1

      - name: Benchmark archsimd
        run: go test -bench=. -benchmem -count=5 ./... | tee benchmark-archsimd.txt
        env:
          CGO_ENABLED: 0
          GOEXPERIMENT: simd

      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat benchmark-cgo.txt benchmark-archsimd.txt